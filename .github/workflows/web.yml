name: Web

on:
  push:
    paths: ['frontend/web/**', 'frontend/app/**', 'frontend/tools/**', '.github/workflows/web.yml']
  pull_request:
    paths: ['frontend/web/**', 'frontend/app/**', 'frontend/tools/**', '.github/workflows/web.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      # The static build reads the public production Sanity dataset.
      - run: npm run build
