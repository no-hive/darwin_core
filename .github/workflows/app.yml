name: App

on:
  push:
    paths: ['app/**', 'web/src/**', 'web/package.json', 'web/package-lock.json', '.github/workflows/app.yml']
  pull_request:
    paths: ['app/**', 'web/src/**', 'web/package.json', 'web/package-lock.json', '.github/workflows/app.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      # React regression tests need repair after the monorepo migration.
      - run: node src/build-app.mjs
