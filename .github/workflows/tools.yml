name: Tools

on:
  push:
    paths: ['frontend/tools/**', 'frontend/app/**', 'frontend/web/**', '.github/workflows/tools.yml']
  pull_request:
    paths: ['frontend/tools/**', 'frontend/app/**', 'frontend/web/**', '.github/workflows/tools.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tools-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==13.0.0
      - run: npm ci --no-audit --no-fund
      # The Worker tests use artifacts produced by the full site build.
      - run: npm run build
      - run: npm run qa:tools
