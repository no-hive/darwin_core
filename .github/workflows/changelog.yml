name: Changelog

on:
  push:
    branches: [main]
    paths-ignore:
      - docs/changelog.mdx
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: changelog-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Generate changelog
        run: git log --no-merges --date=short --format="%H%x09%cs%x09%s" | node scripts/update-changelog.mjs
      - name: Commit changelog update
        run: |
          if git diff --quiet -- docs/changelog.mdx; then
            echo "Changelog is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/changelog.mdx
          git commit -m "docs(docs): update module changelog [skip changelog]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
